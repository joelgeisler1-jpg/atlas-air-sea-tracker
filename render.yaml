services:
  - type: web
    name: atlas-air-sea-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AISSTREAM_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: MAX_AIS_VIEWERS
        value: '3'
